<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>設定 - 両毛線 時刻表</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        /* ==========================================
           列車一覧
        ========================================== */

        .train-list-direction {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 15px;

            margin-bottom: 15px;
        }


        .train-direction-button {

            width: 100%;

            padding: 12px 10px;

            border: 1px solid #ccc;

            border-radius: 10px;

            background: #fff;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }


        .train-direction-button:active {

            transform: scale(0.97);
        }


        .train-direction-button.active {

            background: #222;

            color: #fff;

            border-color: #222;
        }


        /* ==========================================
           列車番号一覧
        ========================================== */

        .train-number-list {

            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }


        .train-number-list.show {

            display: grid;
        }


        .train-number-item {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 50px;

            padding: 8px 6px;

            background: #fff;

            color: #111;

            border: 1px solid #ccc;

            border-radius: 10px;

            text-decoration: none;

            font-size: 19px;

            font-weight: bold;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                opacity 0.15s ease,
                transform 0.15s ease;
        }


        .train-number-item:hover {

            opacity: 0.8;
        }


        .train-number-item:active {

            transform: scale(0.97);
        }


        .train-list-empty {

            display: block;

            grid-column: 1 / -1;

            padding: 20px 10px;

            text-align: center;

            color: #666;

            font-size: 15px;
        }


        /* ==========================================
           詳しい運行情報
        ========================================== */

        .operation-info-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 15px;
        }


        .operation-info-link {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            min-height: 58px;

            padding: 10px 16px;

            background: #fff;

            color: #111;

            border: 1px solid #ccc;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                opacity 0.15s ease,
                transform 0.15s ease;
        }


        .operation-info-link:hover {

            opacity: 0.8;
        }


        .operation-info-link:active {

            transform: scale(0.98);
        }


        .operation-info-text {

            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .operation-info-text strong {

            font-size: 16px;

            line-height: 1.3;
        }


        .operation-info-text small {

            font-size: 12px;

            font-weight: normal;

            color: #666;

            line-height: 1.4;
        }


        .operation-info-arrow {

            font-size: 22px;

            flex-shrink: 0;
        }


        /* ==========================================
           ダークモードの選択肢
        ========================================== */

        body:not(.light-mode) .settings-option {

            background: #222;

            color: #fff;

            border-color: #333;
        }


        body:not(.light-mode) .settings-option-text strong {

            color: #fff;
        }


        body:not(.light-mode) .settings-option-text small {

            color: #aaa;
        }


        body:not(.light-mode)
        .settings-option input[type="radio"] {

            accent-color: #fff;
        }


        /* ==========================================
           ダークモードの列車方向ボタン
        ========================================== */

        body:not(.light-mode)
        .train-direction-button {

            background: #222;

            color: #fff;

            border-color: #333;
        }


        body:not(.light-mode)
        .train-direction-button.active {

            background: #fff;

            color: #111;

            border-color: #fff;
        }


        /* ==========================================
           ダークモードの列車番号
        ========================================== */

        body:not(.light-mode)
        .train-number-item {

            background: #222;

            color: #fff;

            border-color: #333;
        }


        body:not(.light-mode)
        .train-list-empty {

            color: #aaa;
        }


        /* ==========================================
           ダークモードの運行情報
        ========================================== */

        body:not(.light-mode)
        .operation-info-link {

            background: #222;

            color: #fff;

            border-color: #333;
        }


        body:not(.light-mode)
        .operation-info-text strong {

            color: #fff;
        }


        body:not(.light-mode)
        .operation-info-text small {

            color: #aaa;
        }


        /* ==========================================
           ライトモード
        ========================================== */

        body.light-mode .settings-option {

            background: #fff;

            color: #111;

            border-color: #ccc;
        }


        body.light-mode .settings-option-text strong {

            color: #111;
        }


        body.light-mode .settings-option-text small {

            color: #666;
        }


        body.light-mode
        .settings-option input[type="radio"] {

            accent-color: #222;
        }


        body.light-mode
        .train-direction-button {

            background: #fff;

            color: #111;

            border-color: #ccc;
        }


        body.light-mode
        .train-direction-button.active {

            background: #222;

            color: #fff;

            border-color: #222;
        }


        body.light-mode
        .train-number-item {

            background: #fff;

            color: #111;

            border-color: #ccc;
        }


        body.light-mode
        .train-list-empty {

            color: #666;
        }


        body.light-mode
        .operation-info-link {

            background: #fff;

            color: #111;

            border-color: #ccc;
        }


        body.light-mode
        .operation-info-text strong {

            color: #111;
        }


        body.light-mode
        .operation-info-text small {

            color: #666;
        }


        /* ==========================================
           スマートフォン
        ========================================== */

        @media (max-width: 600px) {

            .train-list-direction {

                gap: 8px;

                margin-top: 12px;

                margin-bottom: 12px;
            }


            .train-direction-button {

                padding: 11px 8px;

                font-size: 15px;

                border-radius: 9px;
            }


            .train-number-list {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 7px;
            }


            .train-number-item {

                min-height: 48px;

                padding: 8px 5px;

                font-size: 18px;

                border-radius: 9px;
            }


            .operation-info-list {

                gap: 8px;

                margin-top: 12px;
            }


            .operation-info-link {

                min-height: 54px;

                padding: 9px 13px;

                border-radius: 9px;

                gap: 10px;
            }


            .operation-info-text strong {

                font-size: 14px;
            }


            .operation-info-text small {

                font-size: 11px;
            }


            .operation-info-arrow {

                font-size: 20px;
            }

        }

    </style>

</head>


<body class="settings-page">


<div class="settings-container">


    <!-- ==================================
         ヘッダー
    ================================== -->

    <header class="settings-header">

        <h1>
            設定
        </h1>

        <div class="settings-header-en">
            Settings
        </div>

    </header>



    <!-- ==================================
         デフォルト駅
    ================================== -->

    <section class="settings-section">

        <div class="settings-section-title">
            デフォルト駅
        </div>

        <div class="settings-section-en">
            Default Station
        </div>


        <div class="settings-options">


            <label class="settings-option">

                <input
                    type="radio"
                    name="defaultStation"
                    value="none"
                >

                <span class="settings-option-text">

                    <strong>
                        選択しない
                    </strong>

                    <small>
                        Open Home Screen
                    </small>

                </span>

            </label>



            <label class="settings-option">

                <input
                    type="radio"
                    name="defaultStation"
                    value="tochigi"
                >

                <span class="settings-option-text">

                    <strong>
                        栃木駅
                    </strong>

                    <small>
                        Tochigi Station
                    </small>

                </span>

            </label>



            <label class="settings-option">

                <input
                    type="radio"
                    name="defaultStation"
                    value="sano"
                >

                <span class="settings-option-text">

                    <strong>
                        佐野駅
                    </strong>

                    <small>
                        Sano Station
                    </small>

                </span>

            </label>



            <label class="settings-option">

                <input
                    type="radio"
                    name="defaultStation"
                    value="ashikaga"
                >

                <span class="settings-option-text">

                    <strong>
                        足利駅
                    </strong>

                    <small>
                        Ashikaga Station
                    </small>

                </span>

            </label>


        </div>

    </section>



    <!-- ==================================
         表示モード
    ================================== -->

    <section class="settings-section">

        <div class="settings-section-title">
            表示モード
        </div>

        <div class="settings-section-en">
            Display Mode
        </div>


        <div class="settings-options">


            <label class="settings-option">

                <input
                    type="radio"
                    name="displayMode"
                    value="dark"
                >

                <span class="settings-option-text">

                    <strong>
                        ダーク
                    </strong>

                    <small>
                        Dark
                    </small>

                </span>

            </label>



            <label class="settings-option">

                <input
                    type="radio"
                    name="displayMode"
                    value="light"
                >

                <span class="settings-option-text">

                    <strong>
                        ライト
                    </strong>

                    <small>
                        Light
                    </small>

                </span>

            </label>


        </div>

    </section>



    <!-- ==================================
         列車一覧
    ================================== -->

    <section class="settings-section">

        <div class="settings-section-title">
            列車一覧
        </div>

        <div class="settings-section-en">
            Train List
        </div>


        <div class="train-list-direction">

            <button
                type="button"
                class="train-direction-button"
                id="upButton"
                onclick="showTrainDirection('up')"
            >
                上り
            </button>


            <button
                type="button"
                class="train-direction-button"
                id="downButton"
                onclick="showTrainDirection('down')"
            >
                下り
            </button>

        </div>


        <div
            id="trainNumberList"
            class="train-number-list"
        >

        </div>

    </section>



    <!-- ==================================
         詳しい運行情報
    ================================== -->

    <section class="settings-section">

        <div class="settings-section-title">
            詳しい運行情報
        </div>

        <div class="settings-section-en">
            Detailed Operation Information
        </div>


        <div class="operation-info-list">


            <a
                href="https://traininfo.jreast.co.jp/train_info/line.aspx?gid=1&lineid=ryomoline"
                class="operation-info-link"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="operation-info-text">

                    <strong>
                        JR東日本 両毛線 運行情報
                    </strong>

                    <small>
                        JR East Ryomo Line Operation information
                    </small>

                </span>

                <span class="operation-info-arrow">
                    ↗
                </span>

            </a>



            <a
                href="https://doko-train.jp/pc/"
                class="operation-info-link"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="operation-info-text">

                    <strong>
                        どこトレ
                    </strong>

                    <small>
                        Doko-train
                    </small>

                    <small>
                        列車の遅れと走行位置をリアルタイムで確認できます
                    </small>

                </span>

                <span class="operation-info-arrow">
                    ↗
                </span>

            </a>


        </div>

    </section>



    <!-- ==================================
         保存
    ================================== -->

    <button
        class="settings-save-button"
        onclick="saveSettings()"
        type="button"
    >

        設定を保存

    </button>



    <!-- ==================================
         ホームへ戻る
    ================================== -->

    <div class="settings-back-area">

        <a
            href="/"
            class="settings-back-button"
        >

            <span>
                ホームへ戻る
            </span>

            <small>
                Back to Home
            </small>

        </a>

    </div>


</div>



<script>


/* ==================================
   列車データ
================================== */

let allTrains = [];



/* ==================================
   設定読み込み
================================== */

function loadSettings() {


    const defaultStation =
        localStorage.getItem(
            "defaultStation"
        ) || "none";


    const displayMode =
        localStorage.getItem(
            "displayMode"
        ) || "dark";



    /* デフォルト駅 */

    const stationRadio =
        document.querySelector(
            `input[name="defaultStation"][value="${defaultStation}"]`
        );


    if (stationRadio) {

        stationRadio.checked = true;

    }



    /* 表示モード */

    const modeRadio =
        document.querySelector(
            `input[name="displayMode"][value="${displayMode}"]`
        );


    if (modeRadio) {

        modeRadio.checked = true;

    }

}



/* ==================================
   設定保存
================================== */

function saveSettings() {


    const station =
        document.querySelector(
            'input[name="defaultStation"]:checked'
        );


    const mode =
        document.querySelector(
            'input[name="displayMode"]:checked'
        );



    if (!station) {

        alert(
            "デフォルト駅を選択してください。"
        );

        return;

    }



    if (!mode) {

        alert(
            "表示モードを選択してください。"
        );

        return;

    }



    localStorage.setItem(
        "defaultStation",
        station.value
    );


    localStorage.setItem(
        "displayMode",
        mode.value
    );


    applyDisplayMode(
        mode.value
    );


    alert(
        "設定を保存しました。"
    );

}



/* ==================================
   表示モード
================================== */

function applyDisplayMode(mode) {


    if (
        mode === "light"
    ) {

        document.body.classList.add(
            "light-mode"
        );

    } else {

        document.body.classList.remove(
            "light-mode"
        );

    }

}



/* ==================================
   列車番号を取得
================================== */

function getTrainNumber(train) {

    let trainNumber =
        String(
            train.train_number || ""
        ).trim();


    /*
     * 古いデータ形式にも対応
     */

    if (
        trainNumber === "普通"
        &&
        typeof train.cars === "string"
        &&
        /^\d+M$/.test(
            train.cars.trim()
        )
    ) {

        trainNumber =
            train.cars.trim();

    }


    return trainNumber;

}



/* ==================================
   列車番号の数字部分
================================== */

function getTrainNumberValue(
    trainNumber
) {

    const match =
        trainNumber.match(
            /^(\d+)/
        );


    if (!match) {

        return null;

    }


    return Number(
        match[1]
    );

}



/* ==================================
   列車の方向
================================== */

function getTrainDirection(
    trainNumber
) {

    const number =
        getTrainNumberValue(
            trainNumber
        );


    if (
        number === null
    ) {

        return null;

    }


    /*
     * 奇数 → 下り
     * 偶数 → 上り
     */

    if (
        number % 2 === 1
    ) {

        return "down";

    }


    return "up";

}



/* ==================================
   列車一覧取得
================================== */

async function loadTrainList() {

    try {

        const response =
            await fetch(
                "/api/timetable"
            );


        if (!response.ok) {

            throw new Error(
                "列車情報を取得できませんでした。"
            );

        }


        const data =
            await response.json();


        allTrains =
            Array.isArray(
                data.trains
            )
                ? data.trains
                : [];


    } catch (error) {

        console.error(
            error
        );

    }

}



/* ==================================
   上り・下り表示
================================== */

function showTrainDirection(
    direction
) {


    const upButton =
        document.getElementById(
            "upButton"
        );


    const downButton =
        document.getElementById(
            "downButton"
        );


    if (
        direction === "up"
    ) {

        upButton.classList.add(
            "active"
        );

        downButton.classList.remove(
            "active"
        );

    } else {

        upButton.classList.remove(
            "active"
        );

        downButton.classList.add(
            "active"
        );

    }



    /* 該当方向だけ取得 */

    const directionTrains =
        allTrains.filter(
            function (train) {

                const trainNumber =
                    getTrainNumber(
                        train
                    );


                const trainDirection =
                    getTrainDirection(
                        trainNumber
                    );


                return (
                    trainDirection ===
                    direction
                );

            }
        );



    /* 列車番号順に並べ替え */

    directionTrains.sort(
        function (a, b) {

            const numberA =
                getTrainNumberValue(
                    getTrainNumber(a)
                );


            const numberB =
                getTrainNumberValue(
                    getTrainNumber(b)
                );


            if (
                numberA === null
                &&
                numberB === null
            ) {

                return 0;

            }


            if (
                numberA === null
            ) {

                return 1;

            }


            if (
                numberB === null
            ) {

                return -1;

            }


            return numberA - numberB;

        }
    );



    /* 一覧を取得 */

    const list =
        document.getElementById(
            "trainNumberList"
        );


    list.innerHTML = "";


    list.classList.add(
        "show"
    );



    /* 列車がない場合 */

    if (
        directionTrains.length === 0
    ) {

        list.innerHTML = `

            <div class="train-list-empty">

                該当する列車がありません。

            </div>

        `;

        return;

    }



    /* 列車番号を作成 */

    directionTrains.forEach(
        function (train) {

            const trainNumber =
                getTrainNumber(
                    train
                );


            if (!trainNumber) {

                return;

            }


            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "train-number-item";


            link.href =
                "/train/" +
                encodeURIComponent(
                    trainNumber
                );


            link.textContent =
                trainNumber;


            list.appendChild(
                link
            );

        }
    );

}



/* ==================================
   初期設定
================================== */

const savedMode =
    localStorage.getItem(
        "displayMode"
    ) || "dark";


applyDisplayMode(
    savedMode
);


loadSettings();


loadTrainList();


</script>


</body>

</html>
