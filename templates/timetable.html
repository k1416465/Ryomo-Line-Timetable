<script>

if (

) {

/* ==================================================
   現在の駅
================================================== */

const stationName =

/* ==================================================
   駅ごとの番線設定
================================================== */

const stationConfig = {

        },

        }

    },

        platform1: {

            direction: "上り",

            name: "足利・桐生・高崎方面",

            english: "for Ashikaga, Kiryū & Takasaki"

        },

        platform2: {

            direction: "下り",

            name: "栃木・小山方面",

            english: "for Tochigi & Oyama"

        }

    },


    "足利駅": {

        platform1: {

            direction: "下り",

            name: "佐野・栃木・小山方面",

            english: "for Sano, Tochigi & Oyama"

        },

        platform2: {

            direction: "上り",

            name: "桐生・前橋・高崎方面",

            english: "for Kiryū, Maebashi & Takasaki"

        }

    }

};


const currentStationConfig =
    stationConfig[stationName];


/* ==================================================
   番線情報を表示
================================================== */

function setPlatformInfo() {

    if (!currentStationConfig) {

        return;

    }


    document.getElementById(
        "platform1-direction"
    ).textContent =
        currentStationConfig.platform1.name;


    document.getElementById(
        "platform1-direction-en"
    ).textContent =
        currentStationConfig.platform1.english;


    document.getElementById(
        "platform2-direction"
    ).textContent =
        currentStationConfig.platform2.name;


    document.getElementById(
        "platform2-direction-en"
    ).textContent =
        currentStationConfig.platform2.english;

}


/* ==================================================
   全列車データ
================================================== */

let allTrains = [];


/* ==================================================
   両毛線の運行情報
================================================== */

let operationInfo = {

    status: "情報取得中",

    message: ""

};


/* ==================================================
   下り列車の両数
================================================== */

const downCars = {

    "421M": 6,

    "423M": 4,

    "425M": 6,

    "427M": 4,

    "429M": 4,

    "431M": 4,

    "433M": 6,

    "437M": 4,

    "439M": 4,

    "441M": 6,

    "443M": 4,

    "445M": 4,

    "447M": 4,

    "449M": 4,

    "451M": 4,

    "453M": 4,

    "455M": 6,

    "459M": 6,

    "461M": 4,

    "463M": 6,

    "465M": 6,

    "467M": 4,

    "469M": 4,

    "471M": 6,

    "475M": 4,

    "479M": 6

};


/* ==================================================
   列車データの整理
================================================== */

function normalizeTrain(train) {

    const result = {

        ...train

    };


    /*
     * 「普通」＋「471M」のような
     * データを正しい形に修正
     */

    if (

        result.direction === "下り"

        &&

        result.train_number === "普通"

        &&

        typeof result.cars === "string"

        &&

        /^\d+M$/.test(
            result.cars.trim()
        )

    ) {

        const correctTrainNumber =
            result.cars.trim();


        result.train_number =
            correctTrainNumber;


        result.type =
            "普通";


        result.cars =
            downCars[correctTrainNumber]
            || null;

    }


    /*
     * 列車番号が数字＋Mなのに
     * 両数欄にも同じ値が入っている場合
     */

    if (

        typeof result.cars === "string"

        &&

        /^\d+M$/.test(
            result.cars.trim()
        )

    ) {

        const number =
            result.cars.trim();


        if (

            result.train_number === number

        ) {

            result.cars =
                downCars[number]
                || null;

        }

    }


    if (!result.type) {

        result.type =
            "普通";

    }


    return result;

}


/* ==================================================
   種別の英語
================================================== */

function getTypeEnglish(type) {

    switch (type) {

        case "普通":

            return "Local";


        case "快速":

            return "Rapid";


        case "特急":

            return "Limited Express";


        default:

            return type || "Local";

    }

}


/* ==================================================
   行先の英語
================================================== */

function getDestinationEnglish(destination) {

    const map = {

        "高崎":
            "Takasaki",

        "高崎問屋町":
            "Takasakitonyamachi",

        "井野":
            "Ino",

        "新前橋":
            "Shin-Maebashi",

        "前橋":
            "Maebashi",

        "前橋大島":
            "Maebashiōshima",

        "駒形":
            "Komagata",

        "伊勢崎":
            "Isesaki",

        "国定":
            "Kunisada",

        "岩宿":
            "Iwajuku",

        "桐生":
            "Kiryū",

        "小俣":
            "Omata",

        "山前":
            "Yamamae",

        "足利":
            "Ashikaga",

        "あしかがフラワーパーク":
            "Ashikaga Flower Park",

        "富田":
            "Tomita",

        "佐野":
            "Sano",

        "岩舟":
            "Iwafune",

        "大平下":
            "Ōhirashita",

        "栃木":
            "Tochigi",

        "思川":
            "Omoigawa",

        "小山":
            "Oyama"

    };


    return (

        map[destination]

        ||

        destination

        ||

        ""

    );

}


/* ==================================================
   時刻 → 秒
================================================== */

function timeToSeconds(time) {

    if (!time) {

        return null;

    }


    const parts =
        time.split(":");


    if (parts.length !== 2) {

        return null;

    }


    const hour =
        Number(parts[0]);


    const minute =
        Number(parts[1]);


    if (

        !Number.isFinite(hour)

        ||

        !Number.isFinite(minute)

    ) {

        return null;

    }


    return (

        hour * 60 * 60

        +

        minute * 60

    );

}


/* ==================================================
   駅の発車時刻を取得
================================================== */

function getStationDeparture(train) {

    const stops =
        train.stops || {};


    const stationKey =
        stationName.replace(
            /駅$/,
            ""
        );


    const station =
        stops[stationKey];


    if (!station) {

        return null;

    }


    /*
     * 発車時刻があれば発車時刻。
     * なければ到着時刻。
     */

    return (

        station.departure

        ||

        station.arrival

        ||

        null

    );

}


/* ==================================================
   駅の到着時刻を取得
================================================== */

function getStationArrival(train) {

    const stops =
        train.stops || {};


    const stationKey =
        stationName.replace(
            /駅$/,
            ""
        );


    const station =
        stops[stationKey];


    if (!station) {

        return null;

    }


    return (

        station.arrival

        ||

        station.departure

        ||

        null

    );

}


/* ==================================================
   時刻文字列をDateに変換
================================================== */

function timeToDate(
    time,
    baseDate = new Date()
) {

    if (!time) {

        return null;

    }


    const parts =
        time.split(":");


    if (parts.length !== 2) {

        return null;

    }


    let hour =
        Number(parts[0]);


    const minute =
        Number(parts[1]);


    if (

        !Number.isFinite(hour)

        ||

        !Number.isFinite(minute)

        ||

        minute < 0

        ||

        minute > 59

    ) {

        return null;

    }


    const date =
        new Date(baseDate);


    if (hour >= 24) {

        hour -= 24;

        date.setDate(
            date.getDate() + 1
        );

    }


    date.setHours(
        hour,
        minute,
        0,
        0
    );


    return date;

}


/* ==================================================
   両数を取得
================================================== */

function getCars(train) {

    let cars =
        train.cars;


    /*
     * 「471M」のような値を
     * 両数として扱わない
     */

    if (
        typeof cars === "string"
    ) {

        cars =
            cars.trim();


        if (
            /^\d+M$/.test(cars)
        ) {

            /*
             * 列車番号から両数を取得
             */

            const trainNumber =
                String(
                    train.train_number || ""
                ).trim();


            if (
                downCars[trainNumber]
            ) {

                return downCars[
                    trainNumber
                ];

            }


            return null;

        }

    }


    const number =
        Number(cars);


    if (

        Number.isFinite(number)

        &&

        number > 0

    ) {

        return number;

    }


    return null;

}


/* ==================================================
   到着まで / 停車中 / 発車済
================================================== */

function getArrivalStatus(
    arrival,
    departure
) {

    /*
     * 到着時刻がない場合
     */

    if (!arrival) {

        return {

            number: "",

            label: "",

            status: "normal"

        };

    }


    const now =
        new Date();


    const arrivalDate =
        timeToDate(
            arrival,
            now
        );


    const departureDate =
        timeToDate(
            departure || arrival,
            now
        );


    if (!arrivalDate) {

        return {

            number: "",

            label: "",

            status: "normal"

        };

    }


    if (
        now < arrivalDate
    ) {

        const diffSeconds =
            Math.max(
                0,
                Math.floor(
                    (
                        arrivalDate
                        -
                        now
                    ) / 1000
                )
            );


        const remainingMinutes =
            Math.ceil(
                diffSeconds / 60
            );


        return {

            number:
                remainingMinutes,

            label:
                "分",

            status:
                "normal"

        };

    }


    if (

        departureDate

        &&

        now < departureDate

    ) {

        return {

            number:
                "停車中",

            label:
                "",

            status:
                "stopped"

        };

    }


    return {

        number:
            "発車済",

        label:
            "",

        status:
            "departed"

    };

}


/* ==================================================
   発車後1分で一覧から削除
================================================== */

function isTrainStillDisplayed(train) {

    const departure =
        getStationDeparture(train);


    if (!departure) {

        return false;

    }


    const now =
        new Date();


    const departureDate =
        timeToDate(
            departure,
            now
        );


    if (!departureDate) {

        return false;

    }


    const removeTime =
        new Date(
            departureDate.getTime()
            +
            60 * 1000
        );


    return (
        now < removeTime
    );

}


/* ==================================================
   列車1本分のHTML
================================================== */

function createTrainHTML(train) {

    const type =
        train.type || "普通";


    const typeEnglish =
        getTypeEnglish(type);


    const destination =
        train.destination || "";


    const destinationEnglish =
        getDestinationEnglish(
            destination
        );


    const arrival =
        getStationArrival(train);


    const departure =
        getStationDeparture(train);


    const cars =
        getCars(train);


    const remaining =
        getArrivalStatus(
            arrival,
            departure
        );


    if (
        !isTrainStillDisplayed(train)
    ) {

        return "";

    }


    /* ----------------------------------------------
       両数の色
    ---------------------------------------------- */

    let carsClass =
        "cars-green";


    if (

        cars !== null

        &&

        cars >= 6

    ) {

        carsClass =
            "cars-orange";

    }


    /* ----------------------------------------------
       両数
    ---------------------------------------------- */

    let carsHTML =
        "";


    if (cars !== null) {

        carsHTML = `

            <div
                class="car-badge ${carsClass}"
            >

                <strong>
                    ${cars}
                </strong>

                <span>
                    両
                </span>

            </div>

        `;

    }


    /* ----------------------------------------------
       到着まで
    ---------------------------------------------- */

    let remainingHTML = `

        <div
            class="remaining ${remaining.status}"
        >

            <strong>
                ${remaining.number}
            </strong>

            <span>
                ${remaining.label}
            </span>

        </div>

    `;


    /* ----------------------------------------------
       備考
    ---------------------------------------------- */

    const note =
        train.note || "";


    /*
     * 運行情報に異常がある場合
     */

    const abnormalOperation =

        operationInfo.status
            !== "平常運転"

        &&

        operationInfo.status
            !== "情報取得中"

        &&

        operationInfo.message;


    const isMobile =
        window.innerWidth <= 800;


    let noteHTML =
        "";


    if (
        note
        ||
        abnormalOperation
    ) {

        const noteText =

            isMobile

                ? note

                : `　　${note}`;


        noteHTML = `

            <div class="note">

                ${note
                    ? noteText
                    : ""
                }


                ${
                    abnormalOperation

                    ?

                    `

                        <span
                            style="
                                color: red;
                                font-weight: bold;
                                margin-left: 8px;
                            "
                        >
                            【運行情報】${operationInfo.message}
                        </span>

                    `

                    :

                    ""
                }

            </div>

        `;

    }


    else {

        noteHTML = `

            <div
                class="empty-note"
            ></div>

        `;

    }


    /* ----------------------------------------------
       列車表示
    ---------------------------------------------- */

    return `

        <div
            class="train-row"
            onclick="openTrainDetails(
                '${encodeURIComponent(
                    train.train_number || ""
                )}'
            )"
            style="cursor: pointer;"
        >


            <!-- 種別 -->

            <div>

                <div class="local-box">

                    <strong>
                        ${type}
                    </strong>

                    <span>
                        ${typeEnglish}
                    </span>

                </div>

            </div>


            <!-- 発車時刻 -->

            <div>

                <div
                    class="departure-time"
                >
                    ${departure || ""}
                </div>

            </div>


            <!-- 行先 -->

            <div>

                <div
                    class="destination"
                    style="
                        display:flex;
                        flex-direction:column;
                        align-items:center;
                        justify-content:center;
                        line-height:1;
                        gap:0;
                    "
                >

                    <strong
                        style="
                            display:block;
                            line-height:1.05;
                        "
                    >
                        ${destination}
                    </strong>


                    <span
                        style="
                            display:block;
                            line-height:1;
                            margin-top:0;
                        "
                    >
                        ${destinationEnglish}
                    </span>

                </div>

            </div>


            <!-- 両数 -->

            <div class="cars">

                ${carsHTML}

            </div>


            <!-- 発車まで -->

            <div>

                ${remainingHTML}

            </div>


        </div>


        ${noteHTML}

    `;

}


/* ==================================================
   本日の次の列車を取得
================================================== */

function getTodayUpcomingTrains(
    direction
) {

    const now =
        new Date();


    /*
     * 午前4時までは
     * 前日の列車扱い
     */

    if (
        now.getHours() < 4
    ) {

        return [];

    }


    let trains =

        allTrains

            .filter(
                train =>
                    train.direction
                    === direction
            )

            .filter(
                train =>
                    isTrainStillDisplayed(
                        train
                    )
            );


    trains.sort(
        (a, b) => {

            const aTime =
                timeToDate(
                    getStationDeparture(a),
                    now
                );


            const bTime =
                timeToDate(
                    getStationDeparture(b),
                    now
                );


            if (!aTime) {

                return 1;

            }


            if (!bTime) {

                return -1;

            }


            return (
                aTime - bTime
            );

        }
    );


    return trains.slice(
        0,
        2
    );

}


/* ==================================================
   本日の列車終了
================================================== */

function showServiceFinished(
    container
) {

    container.innerHTML = `

        <div
            class="service-finished"
        >

            本日の列車は終了しました。

        </div>

    `;

}


/* ==================================================
   番線を表示
================================================== */

function renderPlatform(

    containerId,

    headerId,

    direction

) {

    const container =
        document.getElementById(
            containerId
        );


    const header =
        document.getElementById(
            headerId
        );


    const trains =
        getTodayUpcomingTrains(
            direction
        );


    if (
        trains.length === 0
    ) {

        header.style.display =
            "none";


        showServiceFinished(
            container
        );

    }


    else {

        header.style.display =
            "grid";


        container.innerHTML =

            trains

                .map(
                    createTrainHTML
                )

                .join("");

    }

}


/* ==================================================
   列車を表示
================================================== */

function renderTrains() {

    if (
        !currentStationConfig
    ) {

        return;

    }


    renderPlatform(

        "platform1-trains",

        "platform1-header",

        currentStationConfig
            .platform1
            .direction

    );


    renderPlatform(

        "platform2-trains",

        "platform2-header",

        currentStationConfig
            .platform2
            .direction

    );

}


/* ==================================================
   運行情報を取得
================================================== */

async function loadOperationInfo() {

    try {

        const response =
            await fetch(
                "/api/operation?"
                +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "運行情報の取得に失敗しました"
            );

        }


        const data =
            await response.json();


        operationInfo = {

            status:
                data.status
                ||
                "情報取得中",

            message:
                data.message
                ||
                ""

        };


        renderTrains();

    }


    catch (error) {

        console.error(
            "運行情報取得エラー:",
            error
        );

    }

}


/* ==================================================
   timetable.jsonを取得
================================================== */

async function loadTimetable() {

    try {

        const response =

            await fetch(

                "/api/timetable?"
                +
                Date.now()

            );


        if (!response.ok) {

            throw new Error(
                "データ取得に失敗しました"
            );

        }


        const data =
            await response.json();


        allTrains =

            (data.trains || [])

                .map(
                    normalizeTrain
                );


        renderTrains();

    }


    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "platform1-header"
        ).style.display =
            "none";


        document.getElementById(
            "platform2-header"
        ).style.display =
            "none";


        document.getElementById(
            "platform1-trains"
        ).innerHTML = `

            <div
                class="service-finished"
            >

                データを取得できません

            </div>

        `;


        document.getElementById(
            "platform2-trains"
        ).innerHTML = `

            <div
                class="service-finished"
            >

                データを取得できません

            </div>

        `;

    }

}


/* ==================================================
   時計
================================================== */

function updateClock() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =

        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const day =

        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const weekday =

        [

            "日",

            "月",

            "火",

            "水",

            "木",

            "金",

            "土"

        ][
            now.getDay()
        ];


    const hours =

        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );


    const minutes =

        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );


    const seconds =

        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );


    document.getElementById(
        "current-date"
    ).textContent =

        `${year}/${month}/${day}(${weekday})`;


    document.getElementById(
        "current-time"
    ).textContent =

        `${hours}:${minutes}:${seconds}`;

}


/* ==================================================
   ホームへ戻る
================================================== */

function goHome(event) {

    event.preventDefault();


    sessionStorage.setItem(
        "returnToHome",
        "true"
    );


    window.location.href =
        "/";

}


/* ==================================================
   列車詳細ページを開く
================================================== */

function openTrainDetails(
    trainNumber
) {

    if (!trainNumber) {

        return;

    }


    window.location.href =
        "/train/"
        +
        trainNumber;

}

================================================== */

setPlatformInfo();

loadTimetable();

updateClock();


/* ==================================================
   時計を1秒ごとに更新
================================================== */

setInterval(

);

setInterval(

/* ==================================================

setInterval(

/* ==================================================
   両毛線の運行情報を1分ごとに更新
================================================== */

loadOperationInfo();


setInterval(

);
